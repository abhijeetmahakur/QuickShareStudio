name: CI

on:
  push:
    branches: [main, "linux-*"]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib test

      - name: Run tests
        run: flutter test

  lan-protocol:
    name: LAN protocol (desktop server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Two-instance pairing & encrypted-session tunnel test
        run: python test/lan/test_lan_protocol.py
      - name: Desktop in-app update (download, verify, swap, restart)
        run: python test/lan/test_update_flow.py

  internet-e2e:
    name: Internet transfers (PeerJS Cloud + WebRTC in Chrome)
    runs-on: ubuntu-latest
    # Uses the public PeerJS Cloud; a cloud outage must not block merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: flutter pub get
      - run: flutter build web --wasm -t tool/e2e/internet_e2e.dart -o build/e2e_web
      - run: cd tool/e2e && npm install --no-audit --no-fund
      - name: Single-page scenarios (50 MB large file)
        run: node tool/e2e/run_internet_e2e.mjs --bigMb=50 --chrome="$(which google-chrome)"
      - name: Forced TURN relay (local TURN server)
        run: |
          node tool/e2e/turn_server.mjs 3478 &
          sleep 2
          node tool/e2e/run_internet_e2e.mjs --scenarios=forced-relay --turn=turn:127.0.0.1:3478 --turnUser=e2e --turnPass=e2e-secret --chrome="$(which google-chrome)"

  web-build:
    name: Desktop (web) build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --wasm --no-web-resources-cdn

  windows-build:
    name: Windows build and start
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Developer Mode for symlinks
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Name "AllowDevelopmentWithoutDevLicense" -PropertyType DWord -Value 1 -Force
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: The app starts and stays up
        shell: pwsh
        run: |
          $exe = "build\windows\x64\runner\Release\quickshare.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          $p.Refresh()
          if ($p.HasExited) { throw "quickshare.exe exited during startup with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "quickshare.exe started and stayed up for 15 seconds"

  android-build:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # CI smoke-tests the debug variant; distributable releases are signed and
      # certificate-verified in the Release workflow.
      - run: flutter build apk --debug

  ios-build:
    name: iOS build (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
