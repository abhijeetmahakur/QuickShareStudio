name: Release

# A main push builds all platform packages and publishes one versioned GitHub Release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    name: Windows native app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Developer Mode for symlinks
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Name "AllowDevelopmentWithoutDevLicense" -PropertyType DWord -Value 1 -Force
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows release
        run: flutter build windows --release
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Package Windows zip and installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\QuickShareStudio-Windows-x64.zip" -Force
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9\.]+)' | ForEach-Object { $_.Matches.Groups[1].Value }).Trim()
          Write-Host "Packaging version: $ver"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not installed." }
          & $iscc /DMyAppVersion="$ver" windows\installer\quickshare.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
      - name: Smoke-test Windows release packages
        shell: pwsh
        run: |
          & .\tool\release\validate_windows_package.ps1 `
            -ReleaseDirectory "build\windows\x64\runner\Release" `
            -ArchivePath "dist\QuickShareStudio-Windows-x64.zip" `
            -InstallerPath "dist\QuickShareStudio-Windows-Setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/QuickShareStudio-Windows-x64.zip
            dist/QuickShareStudio-Windows-Setup.exe

  linux-release:
    name: Linux AppImage, .deb and .tar.gz
    runs-on: ubuntu-latest
    # Built on the oldest supported base (Ubuntu 22.04, glibc 2.35) so the packages also run
    # on newer Ubuntu, Debian, Fedora and Linux Mint releases.
    container: ubuntu:22.04
    steps:
      - name: Install build tools and GTK
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git curl unzip xz-utils zip jq ca-certificates clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev binutils file imagemagick dpkg-dev \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin python3 >/dev/null
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: git config --global --add safe.directory '*'
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package AppImage, .deb and .tar.gz
        run: bash tool/release/package_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/QuickShareStudio-Linux-x86_64.AppImage
            dist/QuickShareStudio-Linux-x86_64.deb
            dist/QuickShareStudio-Linux-x86_64.tar.gz

  linux-smoke:
    name: Linux starts on ${{ matrix.image }} (${{ matrix.kind }})
    needs: linux-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { image: "ubuntu:22.04", kind: appimage, file: QuickShareStudio-Linux-x86_64.AppImage }
          - { image: "ubuntu:24.04", kind: deb, file: QuickShareStudio-Linux-x86_64.deb }
          - { image: "debian:12", kind: deb, file: QuickShareStudio-Linux-x86_64.deb }
          - { image: "fedora:latest", kind: appimage, file: QuickShareStudio-Linux-x86_64.AppImage }
          - { image: "linuxmintd/mint21.3-amd64", kind: tarball, file: QuickShareStudio-Linux-x86_64.tar.gz }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist
      - name: Start the ${{ matrix.kind }} on ${{ matrix.image }}
        run: |
          mkdir -p smoke
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/smoke:/out" "${{ matrix.image }}" \
            bash /src/tool/release/linux_smoke_test.sh "${{ matrix.kind }}" "/src/dist/${{ matrix.file }}" /out

  android-release:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Configure release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Set the ANDROID_KEYSTORE_BASE64 Actions secret.}"
          : "${KEYSTORE_PASSWORD:?Set the ANDROID_KEYSTORE_PASSWORD Actions secret.}"
          : "${KEY_ALIAS:?Set the ANDROID_KEY_ALIAS Actions secret.}"
          : "${KEY_PASSWORD:?Set the ANDROID_KEY_PASSWORD Actions secret.}"
          : "${EXPECTED_CERT_SHA256:?Set the ANDROID_RELEASE_CERT_SHA256 Actions secret.}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/release.jks
          test -s android/release.jks
          echo "ANDROID_KEYSTORE_PATH=release.jks" >> "$GITHUB_ENV"
          echo "Configured the required Android release keystore."
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/QuickShareStudio-Android.apk
      - name: Verify Android release certificate fingerprint
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          expected_cert="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$expected_cert" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::ANDROID_RELEASE_CERT_SHA256 must be a SHA-256 certificate fingerprint."
            exit 1
          fi
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then echo "::error::Android apksigner was not found."; exit 1; fi
          release_cert="$("$APKSIGNER" verify --print-certs dist/QuickShareStudio-Android.apk | awk -F ': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}' | tr -d '[:space:]:' )"
          if [ -z "$release_cert" ] || [ "$release_cert" != "$expected_cert" ]; then
            echo "::error::The Android release APK certificate does not match ANDROID_RELEASE_CERT_SHA256. Refusing to publish."
            exit 1
          fi
          echo "Android release APK matches the pinned certificate fingerprint."
      - uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: dist/QuickShareStudio-Android.apk

  publish:
    name: Publish GitHub Release
    needs: [windows-release, linux-release, linux-smoke, android-release]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Determine version
        id: ver
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9.]+).*/\1/' | tr -d '[:space:]')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=v$VERSION" >> $GITHUB_ENV
      - name: Generate checksums, update manifest, and release notes
        run: python3 tool/release/make_manifest.py "${{ env.VERSION }}" dist
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: QuickShare Studio ${{ env.TAG }}
          target_commitish: main
          body_path: dist/notes.md
          files: |
            dist/*
