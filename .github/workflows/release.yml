name: Release

# Builds downloadable packages and attaches them to a GitHub Release.
# Trigger: push a version tag, e.g.  git tag v1.6.0 && git push origin v1.6.0
# (or run it manually from the Actions tab).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop-packages:
    name: Windows & Linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build web bundle
        run: |
          flutter pub get
          flutter build web --release --wasm --no-web-resources-cdn

      - name: Package Windows (x64) zip
        run: |
          PKG=dist/QuickShareStudio-Windows
          mkdir -p "$PKG"
          cp -r build/web "$PKG/web"
          cp scripts/server.py scripts/launch.ps1 scripts/launch.vbs app_icon.ico "$PKG/"
          cp LICENSE "$PKG/"
          (cd dist && zip -qr QuickShareStudio-Windows-x64.zip QuickShareStudio-Windows)

      - name: Package Linux tarball
        run: |
          PKG=dist/QuickShareStudio-Linux
          mkdir -p "$PKG"
          cp -r build/web "$PKG/web"
          cp scripts/server.py scripts/launch.sh "$PKG/"
          chmod +x "$PKG/launch.sh"
          cp LICENSE "$PKG/"
          tar -C dist -czf dist/QuickShareStudio-Linux.tar.gz QuickShareStudio-Linux

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-packages
          path: |
            dist/QuickShareStudio-Windows-x64.zip
            dist/QuickShareStudio-Linux.tar.gz

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/QuickShareStudio-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/QuickShareStudio-Android.apk

  publish:
    name: Publish GitHub Release
    needs: [desktop-packages, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
