name: Release

# Builds downloadable packages and attaches them to a GitHub Release.
# Trigger: push a version tag, e.g. git tag v1.0.1 && git push origin v1.0.1
# (or run it manually from the Actions tab).
#
# Optional repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#       Signs every APK with the same key. Without it each build gets a throwaway debug key,
#       and Android refuses to install one release over another (in-app updates fail).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    name: Windows Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows Zip and Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null

          # Create zip of the native Windows release build
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\QuickShareStudio-Windows-x64.zip" -Force
          Write-Host "Created dist\QuickShareStudio-Windows-x64.zip"

          # Compile Inno Setup installer if iscc is available on the runner
          $iscc = "C:\Program Files (x86)\Inno Setup 6\iscc.exe"
          if (Test-Path $iscc) {
            $tag = "${{ github.ref_name }}".TrimStart('v')
            & $iscc /DMyAppVersion="$tag" windows\installer\quickshare.iss
            Write-Host "Compiled Inno Setup installer: dist\QuickShareStudio-Windows-Setup.exe"
          } else {
            Write-Warning "Inno Setup (iscc.exe) not found on runner; skipping setup exe generation."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/*

  android-release:
    name: Android Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Release signing key (from secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "Signing with the release key."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: building with debug signature."
          fi

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/QuickShareStudio-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: dist/QuickShareStudio-Android.apk

  publish:
    name: Publish GitHub Release
    needs: [windows-release, android-release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums & Manifest
        run: |
          python3 tool/release/make_manifest.py "${GITHUB_REF_NAME#v}" dist || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/notes.md
          files: |
            dist/*
