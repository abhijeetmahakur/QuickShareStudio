name: Release

# Builds downloadable packages and attaches them to a GitHub Release, together with
# latest.json + SHA256SUMS.txt, which the in-app updater reads.
# Trigger: push a version tag, e.g.  git tag v2.0.0 && git push origin v2.0.0
# (or run it manually from the Actions tab).
#
# Optional repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#       Signs every APK with the same key. Without it each build gets a throwaway debug key,
#       and Android refuses to install one release over another (in-app updates fail).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop-packages:
    name: Windows & Linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build web bundle
        run: |
          flutter pub get
          flutter build web --release --wasm --no-web-resources-cdn

      - name: Package Windows (x64) zip
        run: |
          PKG=dist/QuickShareStudio-Windows
          mkdir -p "$PKG"
          cp -r build/web "$PKG/web"
          cp scripts/server.py scripts/launch.ps1 scripts/launch.vbs app_icon.ico "$PKG/"
          cp LICENSE VERSION "$PKG/"
          (cd dist && zip -qr QuickShareStudio-Windows-x64.zip QuickShareStudio-Windows)

      - name: Package Linux tarball
        run: |
          PKG=dist/QuickShareStudio-Linux
          mkdir -p "$PKG"
          cp -r build/web "$PKG/web"
          cp scripts/server.py scripts/launch.sh "$PKG/"
          chmod +x "$PKG/launch.sh"
          cp LICENSE VERSION "$PKG/"
          tar -C dist -czf dist/QuickShareStudio-Linux.tar.gz QuickShareStudio-Linux

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-packages
          path: |
            dist/QuickShareStudio-Windows-x64.zip
            dist/QuickShareStudio-Linux.tar.gz

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Release signing key (from secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "Signing with the release key."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is debug-signed and in-app updates between releases will be rejected by Android."
          fi

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/QuickShareStudio-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/QuickShareStudio-Android.apk

  publish:
    name: Publish GitHub Release
    needs: [desktop-packages, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums, update manifest and release notes
        run: python3 tool/release/make_manifest.py "${GITHUB_REF_NAME#v}"

      - uses: softprops/action-gh-release@v2
        with:
          body_path: dist/notes.md
          files: |
            dist/QuickShareStudio-*
            dist/latest.json
            dist/SHA256SUMS.txt
