name: Release

# Push a version tag (for example v2.0.3) to build packages and publish a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    name: Windows native app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows release
        run: flutter build windows --release
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Package Windows zip and installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\QuickShareStudio-Windows-x64.zip" -Force
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not installed." }
          & $iscc /DMyAppVersion="$tag" windows\installer\quickshare.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/QuickShareStudio-Windows-x64.zip
            dist/QuickShareStudio-Windows-Setup.exe

  linux-release:
    name: Linux web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --wasm --no-web-resources-cdn
      - name: Package Linux launcher bundle
        run: |
          PKG=dist/QuickShareStudio-Linux
          mkdir -p "$PKG/web"
          cp -r build/web/. "$PKG/web/"
          cp scripts/server.py scripts/launch.sh "$PKG/"
          chmod +x "$PKG/launch.sh"
          cp LICENSE VERSION "$PKG/"
          tar -C dist -czf dist/QuickShareStudio-Linux.tar.gz QuickShareStudio-Linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/QuickShareStudio-Linux.tar.gz

  android-release:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Configure release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "Signing with configured release key."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret. This APK cannot update installs signed with a different key."
          fi
      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/QuickShareStudio-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: dist/QuickShareStudio-Android.apk

  publish:
    name: Publish GitHub Release
    needs: [windows-release, linux-release, android-release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums, update manifest, and release notes
        run: python3 tool/release/make_manifest.py "${GITHUB_REF_NAME#v}" dist
      - uses: softprops/action-gh-release@v2
        with:
          body_path: dist/notes.md
          files: |
            dist/QuickShareStudio-*
            dist/latest.json
            dist/SHA256SUMS.txt
