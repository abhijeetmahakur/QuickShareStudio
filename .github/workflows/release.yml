name: Release

# A main push builds all platform packages and publishes one versioned GitHub Release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    name: Windows native app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Developer Mode for symlinks
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Name "AllowDevelopmentWithoutDevLicense" -PropertyType DWord -Value 1 -Force
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows release
        run: flutter build windows --release
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Package Windows zip and installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\QuickShareStudio-Windows-x64.zip" -Force
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9\.]+)' | ForEach-Object { $_.Matches.Groups[1].Value }).Trim()
          Write-Host "Packaging version: $ver"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not installed." }
          & $iscc /DMyAppVersion="$ver" windows\installer\quickshare.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
      - name: Smoke-test Windows release packages
        shell: pwsh
        run: |
          & .\tool\release\validate_windows_package.ps1 `
            -ReleaseDirectory "build\windows\x64\runner\Release" `
            -ArchivePath "dist\QuickShareStudio-Windows-x64.zip" `
            -InstallerPath "dist\QuickShareStudio-Windows-Setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/QuickShareStudio-Windows-x64.zip
            dist/QuickShareStudio-Windows-Setup.exe

  linux-release:
    name: Linux AppImage, Debian package, and bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev liblzma-dev libasound2-dev libpulse-dev xvfb
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build web --release --wasm --no-web-resources-cdn
      - run: flutter build linux --release
      - name: Verify Linux WebRTC runtime
        run: |
          set -euo pipefail
          BUNDLE=build/linux/x64/release/bundle
          test -x "$BUNDLE/quickshare"
          test -s "$BUNDLE/lib/libflutter_webrtc_plugin.so"
          test -s "$BUNDLE/lib/libwebrtc.so"
          for object in "$BUNDLE/quickshare" "$BUNDLE/lib/libflutter_webrtc_plugin.so" "$BUNDLE/lib/libwebrtc.so"; do
            echo "Runtime dependencies for $object"
            dependencies="$(ldd "$object")"
            printf '%s\n' "$dependencies"
            if grep -q 'not found' <<<"$dependencies"; then
              echo "::error::A Linux runtime dependency is missing from the WebRTC app bundle."
              exit 1
            fi
          done
      - name: Package Linux AppImage, Debian package, and native/web tarballs
        run: |
          set -euo pipefail
          mkdir -p dist
          BUNDLE=build/linux/x64/release/bundle

          # Keep the web launcher archive for the existing in-app web updater.
          WEB_PKG=dist/QuickShareStudio-Linux-Web
          mkdir -p "$WEB_PKG/web"
          cp -r build/web/. "$WEB_PKG/web/"
          cp scripts/server.py scripts/launch.sh "$WEB_PKG/"
          chmod +x "$WEB_PKG/launch.sh"
          cp LICENSE VERSION "$WEB_PKG/"
          tar -C dist -czf dist/QuickShareStudio-Linux.tar.gz QuickShareStudio-Linux-Web

          # The native tarball contains the executable and every bundled plugin library.
          NATIVE_PKG="$RUNNER_TEMP/QuickShareStudio-Linux-x86_64"
          mkdir -p "$NATIVE_PKG"
          cp -a "$BUNDLE/." "$NATIVE_PKG/"
          cp LICENSE VERSION "$NATIVE_PKG/"
          tar -C "$RUNNER_TEMP" -czf dist/QuickShareStudio-Linux-x86_64.tar.gz QuickShareStudio-Linux-x86_64

          # Installable Debian package.
          VERSION_NUMBER="$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9.]+).*/\1/' | tr -d '[:space:]')"
          DEBDIR="$RUNNER_TEMP/quickshare-deb"
          mkdir -p "$DEBDIR/DEBIAN" "$DEBDIR/usr/bin" "$DEBDIR/usr/lib/quickshare" \
            "$DEBDIR/usr/share/applications" "$DEBDIR/usr/share/icons/hicolor/256x256/apps"
          cp -a "$BUNDLE/." "$DEBDIR/usr/lib/quickshare/"
          cat > "$DEBDIR/DEBIAN/control" <<EOF
          Package: quickshare-studio
          Version: $VERSION_NUMBER
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Abhijeet Mahakur <abhijeetmahakur@users.noreply.github.com>
          Depends: libc6, libgcc-s1, libstdc++6, libgtk-3-0 | libgtk-3-0t64, libblkid1, liblzma5, libpulse0 | libpulse0t64, libasound2 | libasound2t64
          Description: QuickShare Studio cross-platform file sharing and universal clipboard
          EOF
          cat > "$DEBDIR/usr/bin/quickshare" <<'EOF'
          #!/bin/sh
          exec /usr/lib/quickshare/quickshare "$@"
          EOF
          chmod +x "$DEBDIR/usr/bin/quickshare"
          cp assets/logo.png "$DEBDIR/usr/share/icons/hicolor/256x256/apps/quickshare.png"
          cat > "$DEBDIR/usr/share/applications/quickshare.desktop" <<'EOF'
          [Desktop Entry]
          Name=QuickShare Studio
          Exec=/usr/bin/quickshare
          Icon=quickshare
          Type=Application
          Categories=Utility;Network;
          EOF
          dpkg-deb --build --root-owner-group "$DEBDIR" dist/QuickShareStudio-Linux-amd64.deb

          # AppImage with the complete native bundle and a local library search path.
          APPDIR="$RUNNER_TEMP/QuickShareStudio.AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -a "$BUNDLE/." "$APPDIR/usr/bin/"
          cp assets/logo.png "$APPDIR/quickshare.png"
          cp assets/logo.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/quickshare.png"
          cat > "$APPDIR/quickshare.desktop" <<'EOF'
          [Desktop Entry]
          Name=QuickShare Studio
          Exec=quickshare
          TryExec=quickshare
          Icon=quickshare
          Type=Application
          Categories=Utility;Network;
          EOF
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/bin/lib:$HERE/usr/lib:${LD_LIBRARY_PATH:-}"
          cd "$HERE/usr/bin"
          exec "$HERE/usr/bin/quickshare" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          curl -fL --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o "$RUNNER_TEMP/appimagetool.AppImage"
          chmod +x "$RUNNER_TEMP/appimagetool.AppImage"
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 "$RUNNER_TEMP/appimagetool.AppImage" \
            "$APPDIR" dist/QuickShareStudio-Linux-x86_64.AppImage
      - name: Smoke-test packaged Linux AppImage startup
        run: |
          set +e
          xvfb-run -a timeout 15s env APPIMAGE_EXTRACT_AND_RUN=1 LIBGL_ALWAYS_SOFTWARE=1 \
            dist/QuickShareStudio-Linux-x86_64.AppImage > "$RUNNER_TEMP/quickshare-appimage.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/quickshare-appimage.log"
          if [[ "$status" -ne 124 ]]; then
            echo "::error::The Linux AppImage exited during its startup smoke test (exit $status)."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/QuickShareStudio-Linux.tar.gz
            dist/QuickShareStudio-Linux-x86_64.tar.gz
            dist/QuickShareStudio-Linux-x86_64.AppImage
            dist/QuickShareStudio-Linux-amd64.deb

  android-release:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Configure release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${KEY_PASSWORD:?Set the ANDROID_KEY_PASSWORD Actions secret.}"
          : "${EXPECTED_CERT_SHA256:?Set the ANDROID_RELEASE_CERT_SHA256 Actions secret.}"
          bash tool/release/decode_android_keystore.sh android/release.jks
          echo "ANDROID_KEYSTORE_PATH=release.jks" >> "$GITHUB_ENV"
          echo "Configured the required Android release keystore."
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/QuickShareStudio-Android.apk
      - name: Verify Android release certificate fingerprint
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          expected_cert="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$expected_cert" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::ANDROID_RELEASE_CERT_SHA256 must be a SHA-256 certificate fingerprint."
            exit 1
          fi
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then echo "::error::Android apksigner was not found."; exit 1; fi
          release_cert="$("$APKSIGNER" verify --print-certs dist/QuickShareStudio-Android.apk | awk -F ': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}' | tr -d '[:space:]:' )"
          if [ -z "$release_cert" ] || [ "$release_cert" != "$expected_cert" ]; then
            echo "::error::The Android release APK certificate does not match ANDROID_RELEASE_CERT_SHA256. Refusing to publish."
            exit 1
          fi
          echo "Android release APK matches the pinned certificate fingerprint."
      - uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: dist/QuickShareStudio-Android.apk

  publish:
    name: Publish GitHub Release
    needs: [windows-release, linux-release, android-release]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Determine version
        id: ver
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9.]+).*/\1/' | tr -d '[:space:]')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=v$VERSION" >> $GITHUB_ENV
      - name: Generate checksums, update manifest, and release notes
        run: python3 tool/release/make_manifest.py "${{ env.VERSION }}" dist
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: QuickShare Studio ${{ env.TAG }}
          target_commitish: main
          body_path: dist/notes.md
          files: |
            dist/*
